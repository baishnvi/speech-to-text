databases:
  - name: stt-db
    databaseName: speech_to_text
    plan: free

services:
  - type: web
    name: speech-to-text
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stt-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-native-audio-preview-09-2025
